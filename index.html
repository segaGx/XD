<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Клёв — прогноз на 5 дней</title>
<style>
  :root{
    --deep: #16302f;
    --mid: #274d49;
    --line: #3a615c;
    --sand: #d9c49a;
    --sand-dim: #a6906b;
    --moss: #7fa87a;
    --paper: #f2ecdd;
    --bad: #b5624a;
    --ok: #c9a24a;
    --good: #7fa87a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 140% at 10% 0%, #1c3c3a 0%, var(--deep) 45%, #0f2422 100%);
    color: var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{max-width: 640px; margin: 0 auto;}
  header{margin-bottom: 22px;}
  .eyebrow{
    font-family: -apple-system, system-ui, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--sand-dim);
    margin-bottom: 6px;
  }
  h1{
    font-size: 34px;
    margin: 0 0 6px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--sand);
  }
  .sub{
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13.5px;
    color: #b9cdc7;
    line-height: 1.5;
    max-width: 46ch;
  }

  .search-box{
    margin-top: 22px;
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  input[type="text"]{
    flex: 1 1 180px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--paper);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 15px;
    outline: none;
  }
  input[type="text"]::placeholder{color: #7f9994;}
  input[type="text"]:focus{border-color: var(--sand);}
  button{
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active{transform: scale(0.97);}
  .btn-primary{ background: var(--sand); color: var(--deep); }
  .btn-ghost{ background: transparent; color: var(--sand); border: 1px solid var(--line); }
  .btn-ghost:hover{ border-color: var(--sand); }

  .status{
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    color: #9fb8b2;
    margin-top: 14px;
    min-height: 18px;
  }
  .status.err{ color: var(--bad); }

  .place{
    margin-top: 24px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    color: var(--sand-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }

  .days{
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-card{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 16px;
    align-items: start;
  }
  .score-badge{
    width: 64px; height: 64px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex-direction: column;
    border: 2px solid var(--line);
    font-family: -apple-system, system-ui, sans-serif;
  }
  .score-num{ font-size: 22px; font-weight: 700; line-height:1; }
  .score-den{ font-size: 9px; opacity: 0.6; margin-top: 1px;}

  .day-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    flex-wrap: wrap;
  }
  .day-date{ font-size: 17px; color: var(--sand); }
  .day-label{
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .factors{
    margin-top: 10px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12.5px;
    color: #c3d6d0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .factor{ display:flex; align-items:center; gap: 5px; white-space: nowrap;}
  .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }

  .note{
    margin-top: 10px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: #dfe8e4;
    font-style: italic;
  }

  footer{
    margin-top: 26px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 11px;
    color: #6c8983;
    text-align: center;
  }

  .skeleton{
    height: 96px;
    border-radius: 14px;
    background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 37%, rgba(255,255,255,0.03) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{
    0%{background-position: 100% 50%;}
    100%{background-position: 0 50%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Аналитика клёва · 5 дней</div>
    <h1>Будет ли клевать</h1>
    <div class="sub">Тянем давление, ветер, осадки, облачность и температуру с открытых метеослужб, сверяем день к дню и считаем один понятный балл на каждый день.</div>
  </header>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Город, напр. Kraków" />
    <button class="btn-primary" id="searchBtn">Найти</button>
    <button class="btn-ghost" id="geoBtn">Моё место</button>
  </div>

  <div class="status" id="status"></div>
  <div class="place" id="place" style="display:none;"></div>
  <div class="days" id="days"></div>

  <footer>Данные: Open‑Meteo · без ключей и подписок · пересчитывается при каждом запросе</footer>
</div>

<script>
const statusEl = document.getElementById('status');
const placeEl = document.getElementById('place');
const daysEl = document.getElementById('days');
const cityInput = document.getElementById('cityInput');

document.getElementById('searchBtn').addEventListener('click', () => {
  const q = cityInput.value.trim();
  if(!q){ setStatus('Введите название города', true); return; }
  geocodeCity(q);
});
cityInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('searchBtn').click(); });

document.getElementById('geoBtn').addEventListener('click', () => {
  if(!navigator.geolocation){ setStatus('Геолокация недоступна в этом браузере', true); return; }
  setStatus('Определяю местоположение…');
  navigator.geolocation.getCurrentPosition(
    (pos) => runForecast(pos.coords.latitude, pos.coords.longitude, 'Ваше местоположение'),
    () => setStatus('Не удалось получить геолокацию — введите город вручную', true)
  );
});

function setStatus(msg, isErr){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (isErr ? ' err' : '');
}

async function geocodeCity(name){
  setStatus('Ищу город…');
  daysEl.innerHTML = '';
  placeEl.style.display = 'none';
  try{
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=ru&format=json`;
    const r = await fetch(url);
    const data = await r.json();
    if(!data.results || !data.results.length){
      setStatus('Город не найден, попробуйте иначе (например, на английском)', true);
      return;
    }
    const res = data.results[0];
    const label = [res.name, res.admin1, res.country].filter(Boolean).join(', ');
    runForecast(res.latitude, res.longitude, label);
  }catch(e){
    setStatus('Ошибка поиска: ' + e.message, true);
  }
}

async function runForecast(lat, lon, label){
  setStatus('Загружаю погодные данные…');
  daysEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&hourly=surface_pressure,cloudcover,windspeed_10m,precipitation,temperature_2m,weathercode` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max` +
      `&timezone=auto&past_days=1&forecast_days=5`;
    const r = await fetch(url);
    if(!r.ok) throw new Error('сервис недоступен (' + r.status + ')');
    const data = await r.json();
    const results = analyze(data);
    render(results, label);
    setStatus('');
  }catch(e){
    setStatus('Не удалось получить прогноз: ' + e.message, true);
    daysEl.innerHTML = '';
  }
}

function groupByDay(hourly){
  const byDay = {};
  hourly.time.forEach((t, i) => {
    const date = t.slice(0,10);
    if(!byDay[date]) byDay[date] = { pressure:[], cloud:[], wind:[], precip:[], temp:[], code:[] };
    byDay[date].pressure.push(hourly.surface_pressure[i]);
    byDay[date].cloud.push(hourly.cloudcover[i]);
    byDay[date].wind.push(hourly.windspeed_10m[i]);
    byDay[date].precip.push(hourly.precipitation[i]);
    byDay[date].temp.push(hourly.temperature_2m[i]);
    byDay[date].code.push(hourly.weathercode[i]);
  });
  return byDay;
}

function avg(arr){ return arr.reduce((a,b)=>a+b,0) / arr.length; }
function sum(arr){ return arr.reduce((a,b)=>a+b,0); }

function analyze(data){
  const byDay = groupByDay(data.hourly);
  const dates = Object.keys(byDay).sort();
  // dates[0] is past_days=1 (yesterday), rest are forecast
  const out = [];

  for(let i = 1; i < dates.length; i++){
    const today = byDay[dates[i]];
    const yest = byDay[dates[i-1]];

    const pAvgToday = avg(today.pressure);
    const pAvgYest = avg(yest.pressure);
    const pDiff = pAvgToday - pAvgYest; // hPa

    const windAvgKmh = avg(today.wind);
    const windMs = windAvgKmh / 3.6;

    const precipSum = sum(today.precip);
    const maxCode = Math.max(...today.code);
    const isStorm = maxCode >= 95;

    const cloudAvg = avg(today.cloud);

    const tAvgToday = avg(today.temp);
    const tAvgYest = avg(yest.temp);
    const tDiff = Math.abs(tAvgToday - tAvgYest);

    // --- scoring ---
    let pScore, pNote;
    if(Math.abs(pDiff) < 1){ pScore = 3; pNote = 'давление стабильно'; }
    else if(pDiff >= 1 && pDiff <= 3){ pScore = 2; pNote = 'давление плавно растёт'; }
    else if(pDiff < 0 && pDiff >= -3){ pScore = 1; pNote = 'давление немного падает'; }
    else if(pDiff > 3){ pScore = 0.5; pNote = 'давление резко растёт'; }
    else { pScore = 0; pNote = 'давление резко падает — худший сценарий'; }

    let wScore, wNote;
    if(windMs >= 2 && windMs <= 5){ wScore = 2; wNote = `лёгкий ветер ${windMs.toFixed(1)} м/с — хорошо`; }
    else if(windMs > 5 && windMs <= 8){ wScore = 1; wNote = `ветер ${windMs.toFixed(1)} м/с — терпимо`; }
    else if(windMs < 2){ wScore = 1; wNote = `почти штиль ${windMs.toFixed(1)} м/с`; }
    else { wScore = 0; wNote = `сильный ветер ${windMs.toFixed(1)} м/с — мешает`; }

    let rScore, rNote;
    if(isStorm){ rScore = 0; rNote = 'гроза — клёв встанет'; }
    else if(precipSum === 0){ rScore = 1; rNote = 'без осадков'; }
    else if(precipSum > 0 && precipSum <= 2){ rScore = 2; rNote = 'мелкий моросящий дождь — часто помогает'; }
    else if(precipSum > 2 && precipSum <= 8){ rScore = 1; rNote = `дождь ${precipSum.toFixed(1)} мм`; }
    else { rScore = 0; rNote = `сильный дождь ${precipSum.toFixed(1)} мм`; }

    let cScore, cNote;
    if(cloudAvg >= 30 && cloudAvg <= 70){ cScore = 1.5; cNote = 'переменная облачность — оптимально'; }
    else if(cloudAvg > 70){ cScore = 1; cNote = 'пасмурно'; }
    else { cScore = 0.5; cNote = 'ясно, солнечно'; }

    let tScore, tNote;
    if(tDiff < 2){ tScore = 1.5; tNote = 'температура стабильна'; }
    else if(tDiff <= 5){ tScore = 0.7; tNote = `перепад ~${tDiff.toFixed(1)}°C`; }
    else { tScore = 0; tNote = `резкий перепад ~${tDiff.toFixed(1)}°C`; }

    let total = pScore + wScore + rScore + cScore + tScore;
    if(isStorm) total = Math.min(total, 2);
    total = Math.max(0, Math.min(10, total));

    out.push({
      date: dates[i],
      score: Math.round(total * 10) / 10,
      pDiff, windMs, precipSum, cloudAvg, tDiff,
      notes: [pNote, wNote, rNote, cNote, tNote]
    });
  }
  return out;
}

function scoreColor(s){
  if(s >= 7) return getComputedStyle(document.documentElement).getPropertyValue('--good');
  if(s >= 4.5) return getComputedStyle(document.documentElement).getPropertyValue('--ok');
  return getComputedStyle(document.documentElement).getPropertyValue('--bad');
}
function scoreLabel(s){
  if(s >= 7.5) return 'Отличный';
  if(s >= 5.5) return 'Хороший';
  if(s >= 3.5) return 'Средний';
  return 'Слабый';
}
function formatDate(iso){
  const d = new Date(iso + 'T12:00:00');
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function buildNote(item){
  return item.notes.join('; ').replace(/^./, c => c.toUpperCase()) + '.';
}

function render(results, label){
  placeEl.style.display = 'block';
  placeEl.textContent = label;
  daysEl.innerHTML = '';

  results.forEach(item => {
    const color = scoreColor(item.score);
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="score-badge" style="border-color:${color}">
        <div class="score-num" style="color:${color}">${item.score}</div>
        <div class="score-den">из 10</div>
      </div>
      <div>
        <div class="day-head">
          <div class="day-date">${formatDate(item.date)}</div>
          <div class="day-label" style="background:${color}22; color:${color}; border:1px solid ${color}55">${scoreLabel(item.score)}</div>
        </div>
        <div class="factors">
          <div class="factor"><span class="dot" style="background:${color}"></span>Давление ${item.pDiff >= 0 ? '+' : ''}${item.pDiff.toFixed(1)} гПа</div>
          <div class="factor"><span class="dot" style="background:${color}"></span>Ветер ${item.windMs.toFixed(1)} м/с</div>
          <div class="factor"><span class="dot" style="background:${color}"></span>Осадки ${item.precipSum.toFixed(1)} мм</div>
          <div class="factor"><span class="dot" style="background:${color}"></span>Облачность ${Math.round(item.cloudAvg)}%</div>
        </div>
        <div class="note">${buildNote(item)}</div>
      </div>
    `;
    daysEl.appendChild(card);
  });
}
</script>
</body>
</html>
